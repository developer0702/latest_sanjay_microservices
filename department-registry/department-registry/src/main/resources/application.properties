spring.application.name=department-service

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/departments
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.config.import=optional:configserver:http://localhost:8088


# =========================
# Kafka Consumer
# =========================

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=department-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.serviceRegistry.department_registry.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.serviceRegistry.department_registry.event.UserCreatedEvent