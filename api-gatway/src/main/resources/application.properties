spring.application.name=api-gateway
server.port=8082

# =========================================================
# Eureka Client
# =========================================================

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


# =========================================================
# Gateway Routes - Spring Cloud Gateway MVC
# =========================================================

# -------------------------
# User Service
# -------------------------

spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webmvc.routes[0].filters[0]=CircuitBreaker=userServiceCircuitBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.fallbackUri=forward:/fallback/user


# -------------------------
# Department Service
# -------------------------

spring.cloud.gateway.server.webmvc.routes[1].id=department-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://department-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/department/**

spring.cloud.gateway.server.webmvc.routes[1].filters[0]=CircuitBreaker=departmentServiceCircuitBreaker
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.fallbackUri=forward:/fallback/department


# =========================================================
# Actuator
# =========================================================

management.endpoints.web.exposure.include=health,info,gateway


# =========================================================
# Resilience4j - User Service
# =========================================================

resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true


# =========================================================
# Resilience4j - Department Service
# =========================================================

resilience4j.circuitbreaker.instances.departmentServiceCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.departmentServiceCircuitBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.departmentServiceCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.departmentServiceCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.departmentServiceCircuitBreaker.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.departmentServiceCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true